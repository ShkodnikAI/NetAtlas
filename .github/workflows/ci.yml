name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# ВРЕМЕННО (диагностика NR-009): contents:write для лога windows-CI.


jobs:
  build-test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install make (windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: make check (linux)
        if: runner.os == 'Linux'
        run: make check

      - name: make check (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          make check

      - name: windows diagnostics (temp, NR-009)
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          if git log -1 --format=%s | grep -q "ci: windows diagnostics"; then echo "уже диагностический коммит"; exit 0; fi
          { echo "=== gofmt -l ==="; gofmt -l . 2>&1 || true;
            echo "=== go vet ==="; go vet ./... 2>&1 || true;
            echo "=== go test ==="; go test ./... -count=1 2>&1 || true; } > ci-windows-diag.txt
          tail -80 ci-windows-diag.txt
          git config user.email "ci@netatlas.local"
          git config user.name "ci-diag"
          git add ci-windows-diag.txt
          git commit -m "ci: windows diagnostics"
          git push

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: test
        working-directory: web
        run: npm test

      - name: build
        working-directory: web
        run: npm run build

      - name: dist соответствует коммиту
        run: git diff --exit-code web/dist

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
