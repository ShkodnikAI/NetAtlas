name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install make (windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: make check (linux)
        if: runner.os == 'Linux'
        run: make check

      - name: make check (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          make check

      - name: diagnostics (windows)
        if: runner.os == 'Windows' && failure()
        shell: bash
        run: |
          echo "::error::build: $(go build ./... 2>&1 | head -c 500 | tr '\n' '|')"
          echo "::error::vet: $(go vet ./... 2>&1 | head -c 500 | tr '\n' '|')"
          echo "::error::fmt: $(gofmt -l . | head -c 400 | tr '\n' ' ')"
          go test ./... 2>&1 | grep -E "^(FAIL|panic)" | head -c 600 > /tmp/t.txt || true
          echo "::error::test: $(cat /tmp/t.txt | tr '\n' '|')"
          exit 0


  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: test
        working-directory: web
        run: npm test

      - name: build
        working-directory: web
        run: npm run build

      - name: dist соответствует коммиту
        run: git diff --exit-code web/dist

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
