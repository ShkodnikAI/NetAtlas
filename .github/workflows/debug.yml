name: debug-ps-args

on:
  push:
    branches: [nr-027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Изоляция флагов go build
        shell: powershell
        run: |
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          $pkg = './cmd/netatlas-server'
          $ldVersion = "github.com/ShkodnikAI/NetAtlas/internal/version.Version=v0.0.0-debug"
          $ldCommit = "github.com/ShkodnikAI/NetAtlas/internal/version.CommitDate=2026-10-25T15:19:51Z"

          function TryBuild($name, $a) {
              & go build @a 2>&1 | Out-Null
              $code = $LASTEXITCODE
              if ($code -eq 0) { Write-Host "PASS $name" } else { Write-Host "FAIL $name (code=$code)" }
          }

          TryBuild 'D plain'            @($pkg)
          TryBuild 'E trimpath'         @('-trimpath', $pkg)
          TryBuild 'F -s -w'            @('-ldflags', '-s -w', $pkg)
          TryBuild 'G -X только'        @('-ldflags', "-X $ldVersion", $pkg)
          TryBuild 'H trimpath -s -w'   @('-trimpath', '-ldflags', '-s -w', $pkg)
          TryBuild 'I полный'           @('-trimpath', '-ldflags', "-s -w -X $ldVersion -X $ldCommit", $pkg)

          Write-Host '=== Трассировка -x: строка link ==='
          & go build -x -trimpath -ldflags "-s -w -X $ldVersion -X $ldCommit" -o _dbg_out.exe $pkg 2>&1 |
              Where-Object { $_ -match 'link(\.exe)?\s' -or $_ -match 'usage' } |
              ForEach-Object { Write-Host $_ }
